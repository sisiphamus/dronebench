<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DroneBench</title>
<meta name="description" content="An AI agent designed this drone with no example aircraft. A simulator flies every design before it scores.">
<meta name="theme-color" content="#e4e6ec">
<link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Archivo"; src: url(fonts/archivo-latin.woff2) format("woff2"); font-weight: 300 900; font-stretch: 62% 125%; font-display: swap; }
:root { --ink: #0a0b1a; --grey: #e4e6ec; --muted: #54566a; --blue: #2a3cff; --white: #fff; --font: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; color-scheme: light; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--grey); color: var(--ink); font: 400 19px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
main { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
#model { grid-area: 1 / 1; min-height: 0; cursor: grab; touch-action: none; }
#model:active { cursor: grabbing; }
#model canvas { display: block; width: 100%; height: 100%; }
.text { grid-area: 1 / 1; align-self: center; z-index: 2; padding: 0 clamp(20px, 5vw, 72px); pointer-events: none; }
.text a { pointer-events: auto; }
.name { color: var(--ink); max-width: none; font: 900 30px/1 var(--font); font-stretch: 62%; letter-spacing: -.01em; margin: 0 0 28px; }
h1 { font: 900 clamp(3rem, 6.6vw, 5.6rem)/.9 var(--font); font-stretch: 62%; letter-spacing: -.012em; word-spacing: .12em; margin: 0; max-width: 7.6em; }
h1 b { color: var(--blue); font-weight: 900; }
p { color: var(--muted); max-width: 30ch; margin: 22px 0 30px; }
.btn { display: inline-flex; align-items: center; min-height: 52px; padding: 0 30px; border-radius: 999px; background: var(--ink); color: var(--white); font: 700 17px var(--font); text-decoration: none; transition: background .25s cubic-bezier(.16,1,.3,1), transform .12s; }
.btn:hover { background: var(--blue); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
@media (max-width: 800px) and (min-height: 521px) {
  main { grid-template-rows: minmax(0, 1fr) auto; }
  #model { grid-row: 1; }
  .text { grid-row: 2; align-self: end; padding-bottom: 28px; }
  .name { margin-bottom: 14px; font-size: 26px; }
  h1 { font-size: clamp(2.6rem, 12vw, 3.6rem); }
  p { margin: 14px 0 20px; font-size: 17px; }
}
</style>
<script type="importmap">{ "imports": { "three": "./demo/vendor/three.module.js", "three/addons/": "./demo/vendor/addons/" } }</script>
</head>
<body>
<main>
  <div id="model" role="img" aria-label="3D model of the drone the agent designed. Drag to turn it."></div>
  <div class="text">
    <p class="name">DroneBench</p>
    <h1>An agent designed this drone from <b>nothing</b>.</h1>
    <p>Every design is flown in a simulator before it scores. After 38 attempts in one run, this one flies 726 simulated minutes.</p>
    <a class="btn" href="https://github.com/sisiphamus/dronebench">View the repo</a>
  </div>
</main>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const el = document.getElementById('model');
const gl = (() => { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch { return false; } })();
if (!gl) el.style.display = 'none';
else {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  el.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(28, 1, 0.01, 60);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8e94ad, 1.55));
  const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(-2, 4, 3); scene.add(sun);
  const controls = new OrbitControls(cam, renderer.domElement);
  controls.enableDamping = true; controls.enablePan = false; controls.enableZoom = false;
  controls.autoRotate = !reduce; controls.autoRotateSpeed = 1.1;
  let box = null;
  const fit = () => {
    const r = el.getBoundingClientRect(); if (!r.width || !box) return;
    renderer.setSize(r.width, r.height, false); cam.aspect = r.width / r.height;
    const wide = r.width > 800 || innerHeight <= 520, pad = wide ? 1.65 : 1.2;
    if (wide) cam.setViewOffset(r.width, r.height, -r.width * 0.17, 0, r.width, r.height); else cam.clearViewOffset();   // model sits right of the words
    cam.updateProjectionMatrix();
    const sz = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
    const hf = Math.atan(Math.tan(THREE.MathUtils.degToRad(cam.fov) / 2) * cam.aspect);
    const dist = (Math.max(sz.x, sz.z) / 2 * pad) / Math.tan(hf);
    controls.target.copy(ctr);
    cam.position.copy(ctr).add(new THREE.Vector3(-0.5, 0.5, 1).normalize().multiplyScalar(dist));
    controls.update();
  };
  new GLTFLoader().load('demo/data/step/38.glb', (g) => {
    const m = new THREE.MeshStandardMaterial({ color: 0x1c1e33, roughness: 0.55, metalness: 0.04, side: THREE.DoubleSide });
    g.scene.traverse((o) => { if (o.isMesh) o.material = m; });
    scene.add(g.scene);
    box = new THREE.Box3().setFromObject(g.scene);
    fit();
    new ResizeObserver(fit).observe(el);
    (function loop() { controls.update(); renderer.render(scene, cam); requestAnimationFrame(loop); })();
  }, undefined, () => { el.style.display = 'none'; });
}
</script>
</body>
</html>
