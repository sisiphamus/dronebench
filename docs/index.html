<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DroneBench</title>
<meta name="description" content="An AI agent designed this drone with no example aircraft. Every attempt was tested in a simulator.">
<meta name="theme-color" content="#cdced2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23141414'/%3E%3Cpath d='M3 17 L29 9 L29 12 L3 20Z' fill='white'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Archivo"; src: url(fonts/archivo-latin.woff2) format("woff2"); font-weight: 300 900; font-stretch: 62% 125%; font-display: swap; }
:root {
  --ink: #141414; --paper: #f1f1f2; --stone: #dcdcde; --lilac: #b58cf6; --lime: #b9f23f; --orange: #b58cf6; --white: #fff;
  --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.16,1,.3,1); --r: 22px; --gap: 12px;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; }
body { color: var(--ink); font: 500 16px/1.4 var(--font); letter-spacing: -.01em; word-spacing: .06em; -webkit-font-smoothing: antialiased;
  background: radial-gradient(60vmax 50vmax at 12% 8%, #e9e9ec, transparent 60%), radial-gradient(55vmax 45vmax at 92% 92%, #aeb2bd, transparent 62%), radial-gradient(40vmax 40vmax at 78% 12%, #c9c9cf, transparent 60%), #cdced2; }
a, button { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.stage { box-sizing: border-box; height: 100%; padding: 18px; display: grid; }
.panel { box-sizing: border-box; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 14px; padding: 14px 14px 16px; border-radius: 30px; background: var(--paper);
  background-image: radial-gradient(rgba(20,20,20,.13) 1px, transparent 1.4px); background-size: 22px 22px;
  box-shadow: 0 1px 0 #fff inset, 0 30px 70px -20px rgba(20,20,30,.35), 0 8px 20px -8px rgba(20,20,30,.18); }

.nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 2px 4px 0 6px; }
.brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 700; font-size: 18px; text-decoration: none; }
.dot { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; }
.dot svg { width: 18px; height: 18px; }
.acts { display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 20px; border: 0; border-radius: 999px; background: var(--stone); font-weight: 600; font-size: 15px; text-decoration: none; cursor: pointer; white-space: nowrap; transition: background .25s var(--ease), color .25s var(--ease), transform .12s; }
.pill:hover { background: #cfcfd2; }
.pill.dark { background: var(--ink); color: var(--white); } .pill.dark:hover { background: #333; }
.pill:active { transform: translateY(1px); }

.bento { min-height: 0; display: grid; gap: var(--gap); grid-template-columns: minmax(0, 1.7fr) minmax(0, .8fr) minmax(0, .8fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
.tile { position: relative; min-width: 0; min-height: 0; border-radius: var(--r); overflow: hidden; }

.hero { grid-column: 1; grid-row: 1 / span 2; background: var(--ink); color: var(--white); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding: 28px 30px 24px; }
.hero h1 { margin: 0; font: 600 clamp(2.4rem, 4.6vw, 4.6rem)/.94 var(--font); letter-spacing: -.045em; max-width: 8.5ch; }
.hero p { margin: 14px 0 0; max-width: 31ch; color: rgba(255,255,255,.62); font-size: 15px; }
.draw { position: relative; min-height: 0; margin: 6px -10px 6px; }
#view { position: absolute; inset: 0; }
#view canvas { display: block; width: 100%; height: 100%; }
#dim { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
#dim text { fill: var(--white); font: 600 15px var(--font); font-variant-numeric: tabular-nums; text-anchor: middle; dominant-baseline: central; }
.status { justify-self: start; display: flex; align-items: center; gap: 14px; max-width: 100%; padding: 12px 18px; border-radius: 16px; background: var(--paper); color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.status small { display: block; color: #6b6b70; font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.status > div { min-width: 0; } .status b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.status .sep { align-self: stretch; width: 1px; background: rgba(20,20,20,.18); }
.chip { display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 50%; background: var(--ink); vertical-align: 0; }
.chip.no { background: var(--orange); }

.score { grid-column: 2 / span 2; grid-row: 1; background: var(--stone); padding: 22px 26px 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto 1fr; gap: 0 16px; }
.cap { margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: #55555a; }
.big { align-self: end; margin: 0; font: 600 clamp(2.6rem, 5.2vw, 5.2rem)/.9 var(--font); letter-spacing: -.05em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.score .sub { margin: 10px 0 0; font-size: 14px; color: #55555a; }
#spark { grid-column: 2; grid-row: 1 / span 2; align-self: stretch; justify-self: stretch; width: 100%; height: 100%; overflow: visible; }
#spark path { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linejoin: round; vector-effect: non-scaling-stroke; }

.link { display: grid; grid-template-rows: auto 1fr; padding: 18px 20px 18px; text-decoration: none; color: var(--ink); transition: transform .35s var(--ease), box-shadow .35s var(--ease); }
.link:hover { transform: translateY(-3px); box-shadow: 0 16px 30px -14px rgba(20,20,30,.4); }
.link.lilac { grid-column: 2; grid-row: 2; background: var(--lilac); }
.link.lime { grid-column: 3; grid-row: 2; background: var(--lime); }
.link .cap { color: rgba(20,20,20,.8); word-spacing: .18em; max-width: 14ch; padding-right: 28px; box-sizing: content-box; }
.link .word { align-self: end; font: 600 clamp(1.7rem, 2.8vw, 2.8rem)/.95 var(--font); letter-spacing: -.045em; }
.arrow { position: absolute; top: 16px; right: 16px; width: 22px; height: 22px; transition: transform .35s var(--ease); }
.link:hover .arrow { transform: translate(3px, -3px); }

/* phones and narrow windows: one column, still no scroll */
@media (max-width: 900px) {
  .stage { padding: 10px; } .panel { padding: 10px 10px 12px; gap: 10px; border-radius: 24px; } :root { --r: 18px; --gap: 8px; }
  .brand { font-size: 16px; } .dot { width: 30px; height: 30px; } .pill { min-height: 38px; padding: 0 14px; font-size: 14px; }
  .bento { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto; }
  .hero { grid-column: 1 / span 2; grid-row: 1; padding: 20px 18px 16px; }
  .hero h1 { font-size: clamp(2.2rem, 11vw, 3.4rem); } .hero p { margin-top: 8px; font-size: 14px; }
  .status { padding: 9px 14px; gap: 10px; font-size: 14px; }
  .score { grid-column: 1 / span 2; grid-row: 2; padding: 14px 16px 12px; grid-template-rows: auto auto; }
  .big { font-size: clamp(2.2rem, 11vw, 3.2rem); } .score .sub { display: none; } #spark { grid-row: 1 / span 2; }
  .link { padding: 12px 14px 12px; min-height: 84px; } .link .word { font-size: 1.7rem; } .link .cap { max-width: none; font-size: 11px; }
  .link.lilac { grid-column: 1; grid-row: 3; } .link.lime { grid-column: 2; grid-row: 3; }
  .arrow { top: 12px; right: 12px; width: 18px; height: 18px; }
}
@media (max-width: 900px) and (max-height: 700px) { .hero p { display: none; } .link { min-height: 70px; } .status small { display: none; } }
@media (min-width: 901px) and (max-height: 760px) { .hero p { display: none; } .hero { padding: 20px 24px 18px; } .score { padding: 16px 20px; } .score .sub { display: none; } .link { padding: 14px 16px; } }
@media (max-height: 520px) and (min-width: 600px) { .hero { grid-template-columns: minmax(0, .8fr) minmax(0, 1.3fr); grid-template-rows: minmax(0, 1fr) auto; column-gap: 8px; } .hero > div:first-child { grid-column: 1; grid-row: 1; } .draw { grid-column: 2; grid-row: 1 / span 2; margin: 0; } .status { grid-column: 1; grid-row: 2; } }
@media (max-height: 520px) { .score { display: none; } .bento { grid-template-rows: minmax(0, 1fr) auto; } .hero { grid-row: 1; } .link.lilac, .link.lime { grid-row: 2; min-height: 56px; } .hero p { display: none; } .hero h1 { font-size: 2rem; } .status small { display: none; } .nav { padding-top: 0; } }
@media (max-width: 360px) { .pill { padding: 0 9px; font-size: 12px; } .acts { gap: 6px; } .brand span { font-size: 15px; } .status .sep, .status .more { display: none; } }
@media (prefers-reduced-motion: reduce) { .pill, .link, .arrow { transition: none; } .link:hover { transform: none; } }
</style>

<body>
<div class="stage"><div class="panel">
  <header class="nav">
    <a class="brand" href="./"><i class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M2 14 L22 7 V10 L2 17Z" fill="#fff"/></svg></i><span>DroneBench</span></a>
    <div class="acts">
      <button class="pill" id="redraw" type="button">Redraw</button>
      <a class="pill dark" href="https://github.com/sisiphamus/dronebench">GitHub</a>
    </div>
  </header>

  <main class="bento">
    <section class="tile hero">
      <div>
        <h1>Drawn from nothing.</h1>
        <p>An AI agent designed this drone with no example aircraft. Every attempt was tested in a simulator.</p>
      </div>
      <div class="draw">
        <div id="view" role="img" aria-label="A blank dark sheet. An AI agent's 38 attempts at a drone are drawn on it one after another in white line; kept designs stay, rejected ones flash purple and are wiped away. The last design, a long-winged glider, stays."></div>
        <svg id="dim" aria-hidden="true"></svg>
      </div>
      <div class="status">
        <div><small>Attempt</small><b id="bAttempt">0 of 38</b></div>
        <i class="sep"></i>
        <div><small>Result</small><b id="bResult">Blank sheet</b></div>
      </div>
    </section>

    <section class="tile score">
      <p class="cap">Best flight, simulated</p>
      <p class="big"><span id="bBest">0 min</span></p>
      <svg id="spark" viewBox="0 0 200 90" preserveAspectRatio="none" aria-hidden="true"><path id="sparkLine" d=""/></svg>
      <p class="sub">Battery <b id="bBatt">0 Wh</b></p>
    </section>

    <a class="tile link lilac" href="https://github.com/sisiphamus/dronebench/blob/f64a02b/results/from_scratch/sonnet-5-5/LOG.md">
      <span class="cap">Every step the agent took</span><span class="word">The log</span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
    </a>
    <a class="tile link lime" href="https://github.com/sisiphamus/dronebench">
      <span class="cap">Test your own agent</span><span class="word">The repo</span>
      <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
    </a>
  </main>
</div></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const $ = (s) => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ease = (t) => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
const PLAIN = { battery_current: 'battery current', esc_current: 'speed controller current', motor_current: 'motor current', static_margin: 'balance',
  stall_margin: 'stall margin', spar: 'wing strength', clearance: 'parts colliding', shell_structure: 'shell too thin', battery_fit: 'battery fit',
  climb: 'climb rate', mtow: 'too heavy', control_chain: 'controls', harness: 'wiring', airframe_connected: 'parts not connected', fuselage_continuous: 'body broken',
  tail_volume: 'tail size', servo_torque: 'servo strength', power_chain: 'power chain', payload: 'payload', lifting_surfaces: 'wing or tail missing',
  no_stall: 'stalled in a flight', gusts_gusty: 'lost control in gusts', gusts_light: 'lost control in gusts', load_factor: 'load in gusts' };

const data = await fetch('data/attempts.json').then((r) => r.json()).catch(() => null);
const N = data ? data.length : 38;
const final = data ? data[data.length - 1] : null;
const bestAt = (i) => Math.max(0, ...data.slice(0, i + 1).filter((a) => a.kept).map((a) => a.score));
const best = data ? data.map((_, i) => bestAt(i)) : [];
const lo = Math.min(...best.filter((b) => b > 0)), hi = Math.max(...best);
const spark = (i) => {   // best flight time so far, one step per attempt, drawn up to attempt i
  const pts = [];
  for (let k = 0; k <= i; k++) if (best[k] > 0) pts.push(`${(k / (N - 1) * 200).toFixed(1)},${(84 - (best[k] - lo) / (hi - lo || 1) * 78).toFixed(1)}`);
  $('#sparkLine').setAttribute('d', pts.length ? 'M' + pts.join(' L') : '');
};
const setBlock = (i, result, kept) => {
  const a = data[i]; spark(i);
  $('#bAttempt').textContent = `${a.n} of ${N}`;
  $('#bBatt').textContent = `${a.wh} Wh`;
  $('#bBest').textContent = `${bestAt(i).toFixed(0)} min`;
  $('#bResult').innerHTML = result ? `<i class="chip${kept ? '' : ' no'}"></i>${result}` : 'Drawing';
};

const gl = (() => { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch { return false; } })();
if (!data || !gl) {
  // no drawing possible: show the end state in the block, hide the sheet
  $('.draw').style.visibility = 'hidden';
  if (final) { const i = N - 1; setBlock(i, `Kept, ${final.score.toFixed(0)} min`, true); }
  $('#redraw').style.display = 'none';
} else {
  const view = $('#view'), dimSvg = $('#dim');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.localClippingEnabled = true;
  view.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 50);

  // materials: ink (current, white), warn (rejected, purple), ghost (the kept design while a new one is tried)
  const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  const L = (color, opacity, clip) => new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity, clippingPlanes: clip ? [plane] : null });
  const F = (color, opacity, clip) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false, clippingPlanes: clip ? [plane] : null });
  const M = {
    ink: [L(0xffffff, 1, true), F(0xffffff, 0.1, true)],
    warn: [L(0xb58cf6, 1, true), F(0xffffff, 0.07, true)],
    ghost: [L(0xffffff, 0.42, false), F(0xffffff, 0.04, false)],
    trace: [L(0xffffff, 0.22, false), F(0xffffff, 0, false)],   // every earlier kept design stays behind as a faint trace
  };
  const pen = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.014), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  pen.rotation.x = -Math.PI / 2; pen.visible = false; scene.add(pen);

  const loader = new GLTFLoader();
  const loadStep = (n) => fetch(`demo/data/step/${n}.glb`).then((r) => r.arrayBuffer()).then((b) => new Promise((res, rej) => loader.parse(b, '', (g) => res(g.scene), rej)));
  function build(root) {
    root.updateMatrixWorld(true);
    const pos = [], fills = new THREE.Group();
    root.traverse((o) => {
      if (!o.isMesh) return;
      const e = new THREE.EdgesGeometry(o.geometry, 18), a = e.attributes.position, v = new THREE.Vector3();
      for (let i = 0; i < a.count; i++) { v.fromBufferAttribute(a, i).applyMatrix4(o.matrixWorld); pos.push(v.x, v.y, v.z); }
      const m = new THREE.Mesh(o.geometry, M.ink[1]); m.matrixAutoUpdate = false; m.matrix.copy(o.matrixWorld); fills.add(m);
    });
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    const lines = new THREE.LineSegments(g, M.ink[0]);
    const grp = new THREE.Group(); grp.add(fills, lines); grp.visible = false;
    grp.userData.role = (r) => { lines.material = M[r][0]; fills.children.forEach((c) => { c.material = M[r][1]; }); };
    scene.add(grp);
    return { grp, box: new THREE.Box3().setFromObject(root) };
  }

  // frame: look straight down, nose to the top (span across a wide screen) or nose to the right (span down a tall one)
  let ext = null, portrait = false, zHalf = 2, pxPerM = 1, margin = 0.46;
  const steps = [];
  function layout() {
    const w = view.clientWidth, h = view.clientHeight; if (!w || !h || !ext) return;
    renderer.setSize(w, h, false);
    // pick whichever way the aircraft is drawn larger: span across (nose up) or span down (nose right)
    const span = 2 * zHalf, fit = (m) => { const len = ext.max.x - ext.min.x + m; return [Math.min(w / (span * 1.1), h / len), Math.min(w / len, h / (span * 1.12))]; };
    const up = fit(0.46)[0], right = fit(0.7)[1];
    portrait = right > up * 1.05;
    margin = portrait ? 0.7 : 0.46;   // room for the dimension line beside the aft end
    pxPerM = portrait ? right : up;
    const cx = (ext.min.x + ext.max.x) / 2 + margin / 2;   // centre of the aircraft plus the room kept for the dimension line
    cam.left = -w / 2 / pxPerM; cam.right = w / 2 / pxPerM; cam.top = h / 2 / pxPerM; cam.bottom = -h / 2 / pxPerM;
    cam.position.set(cx, 10, 0);
    cam.up.set(portrait ? 0 : -1, 0, portrait ? 1 : 0);
    cam.lookAt(cx, 0, 0);
    cam.updateProjectionMatrix();
    dimSvg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  }
  const proj = new THREE.Vector3();
  const toPx = (x, z) => { proj.set(x, 0, z).project(cam); return [(proj.x + 1) / 2 * view.clientWidth, (1 - proj.y) / 2 * view.clientHeight]; };
  let dimSpan = 0, dimOn = 0;
  function drawDim() {
    if (!dimOn || !ext) { dimSvg.innerHTML = ''; return; }
    const xr = ext.max.x + margin * 0.42, h = dimSpan / 2;
    const [x1, y1] = toPx(xr, h), [x2, y2] = toPx(xr, -h), mx = (x1 + x2) / 2, my = (y1 + y2) / 2, t = 7;
    const hor = Math.abs(x2 - x1) > Math.abs(y2 - y1);
    const tick = (x, y) => hor ? `M${x},${y - t}V${y + t}` : `M${x - t},${y}H${x + t}`;
    const lab = `${dimSpan.toFixed(1)} m`, gap = 34;
    const a = hor ? `M${x1},${y1}H${mx - gap}M${mx + gap},${y1}H${x2}` : `M${x1},${y1}V${my - 14}M${x1},${my + 14}V${y2}`;
    dimSvg.innerHTML = `<path d="${a}${tick(x1, y1)}${tick(x2, y2)}" stroke="#fff" stroke-width="1.5" fill="none"/><text x="${mx}" y="${my}">${lab}</text>`;
  }

  // load every attempt, then draw them in order
  const loaded = await Promise.all(data.map((a) => loadStep(a.n).then(build)));
  loaded.forEach((s) => steps.push(s));
  ext = new THREE.Box3(); loaded.forEach((s) => ext.union(s.box));
  zHalf = Math.max(...loaded.map((s) => Math.max(Math.abs(s.box.min.z), Math.abs(s.box.max.z)))) + 0.02;
  layout(); new ResizeObserver(layout).observe(view);

  let run = 0;
  const wait = (ms, my) => new Promise((res) => setTimeout(() => res(my === run), ms));
  const frames = (ms, fn, my) => new Promise((res) => {
    const t0 = performance.now();
    const f = (t) => { if (my !== run) return res(false); const k = Math.min(1, (t - t0) / ms); fn(k); k < 1 ? requestAnimationFrame(f) : res(true); };
    requestAnimationFrame(f);
  });
  const setPlane = (mode, z) => {   // mode 'draw': show z >= front (grows toward -z); 'erase': show z <= front (shrinks from +z)
    if (mode === 'draw') { plane.normal.set(0, 0, 1); plane.constant = -z; } else { plane.normal.set(0, 0, -1); plane.constant = z; }
  };
  const penAt = (z, color) => { pen.visible = true; pen.position.set((ext.min.x + ext.max.x) / 2, 0.05, z); pen.scale.set((ext.max.x - ext.min.x) + 0.1, 1, 1); pen.material.color.set(color); };

  function loop() { renderer.render(scene, cam); drawDim(); requestAnimationFrame(loop); }
  loop();

  async function play() {
    const my = ++run;
    steps.forEach((s) => { s.grp.visible = false; s.grp.userData.role('ink'); });
    pen.visible = false; dimOn = 0; dimSpan = 0;
    $('#bAttempt').textContent = `0 of ${N}`; $('#bResult').textContent = 'Blank sheet'; $('#bBatt').textContent = '0 Wh'; $('#bBest').textContent = '0 min'; spark(-1);
    if (reduce) { showFinal(); return; }
    if (!(await wait(1400, my))) return;
    let keptGrp = null;
    for (let i = 0; i < N; i++) {
      const a = data[i], s = steps[i], late = i / (N - 1);
      setBlock(i, null);
      if (keptGrp) keptGrp.userData.role('ghost');
      s.grp.userData.role(a.kept ? 'ink' : 'warn'); s.grp.visible = true; s.grp.renderOrder = 2;
      const color = a.kept ? 0xffffff : 0xb58cf6;
      const from = dimSpan || a.span; dimOn = 1;
      const drawMs = 620 - 400 * late;
      const ok = await frames(drawMs, (k) => { const z = zHalf - 2 * zHalf * ease(k); setPlane('draw', z); penAt(z, color); dimSpan = from + (a.span - from) * ease(k * 1.6); }, my);
      if (!ok) return;
      setPlane('draw', -zHalf - 1); pen.visible = false;
      const prev = i > 0 ? data.slice(0, i).filter((q) => q.kept).pop() : null;
      if (a.kept) {
        setBlock(i, prev ? `Kept, ${(a.score - prev.score >= 0 ? '+' : '') + (a.score - prev.score).toFixed(1)} min` : `Kept, first flight`, true);
        if (!(await wait(130, my))) return;
        if (keptGrp) keptGrp.userData.role('trace');
        keptGrp = s.grp;
      } else {
        const why = a.gate ? 'scored lower' : [...new Set(a.fail.map((f) => PLAIN[f] || f.replace(/_/g, ' ')))].slice(0, 2).join(' and ');
        setBlock(i, `Rejected, ${why}`, false);
        if (!(await wait(260, my))) return;
        const ok2 = await frames(190, (k) => { const z = zHalf - 2 * zHalf * ease(k); setPlane('erase', z); penAt(z, 0xb58cf6); }, my);
        if (!ok2) return;
        s.grp.visible = false; pen.visible = false;
        if (keptGrp) keptGrp.userData.role('ink');
      }
    }
  }
  function showFinal() {
    steps.forEach((s) => { s.grp.visible = false; });
    data.forEach((a, i) => { if (a.kept && i < N - 1) { steps[i].grp.userData.role('trace'); steps[i].grp.visible = true; } });
    const s = steps[N - 1]; s.grp.userData.role('ink'); s.grp.visible = true; setPlane('draw', -zHalf - 1);
    const kept = data.filter((a) => a.kept), d = final.score - kept[kept.length - 2].score;
    dimSpan = final.span; dimOn = 1; setBlock(N - 1, `Kept, +${d.toFixed(1)} min`, true);
  }
  $('#redraw').addEventListener('click', play);
  play();
}
</script>
