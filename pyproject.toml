[project]
name = "dronebench"
version = "0.1.0"
description = "Benchmark environment for small electric fixed-wing UAV designs"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "trimesh", "pyyaml", "shapely", "rtree", "networkx", "cascadio", "lxml"]

[project.scripts]
dronebench = "dronebench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dronebench*"]

[tool.setuptools.package-data]
dronebench = ["viewer/*.html", "viewer/*.js"]
